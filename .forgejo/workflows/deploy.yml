name: deploy-ai-site

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: docker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build imagem e redeploy
        run: |
          echo "Commit: ${{ github.sha }}"
          cd /workspace/gtihq/ai-site
          docker build -t ai-site-ai-site:latest .
          docker service update --force ai-site
          echo "Deploy concluido"
